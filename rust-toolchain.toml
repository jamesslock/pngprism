# T-0149 rework: pin the exact toolchain this crate's fmt/clippy output was
# last verified against (rustc 1.96.1 / rustfmt 1.9.0 / clippy 0.1.96, all
# from the same Rust release train). This is a *tooling* pin, distinct from
# `Cargo.toml`'s `rust-version = "1.87"` (the crate's declared MSRV floor —
# the oldest compiler the CODE is allowed to require). This file pins the
# newest end: the one compiler/fmt/lint version combination CI and local
# dev are expected to match, so `cargo fmt --check` and `clippy -D warnings`
# give the same answer everywhere.
#
# Why this file exists (2026-07-19, T-0149 cross-review by kimi-k2-8): the
# CI workflow originally used a floating `dtolnay/rust-toolchain@stable`
# with no pin anywhere in the repo. `rustfmt`'s formatting rules are not
# perfectly stable across releases (a `stable` bump changed how long call
# expressions/match arms get reflowed), so `cargo fmt --check` on
# `benches/stage_boundaries.rs` and `tests/adversarial_suite.rs` started
# failing with zero code changes — exactly the hazard this pin closes.
#
# Effectiveness caveat (read before assuming this "just works"): this file
# is honored by RUSTUP when a rustup-proxied `cargo`/`rustc` resolves the
# active toolchain by walking UP from the current working directory. It is
# NOT consulted when the working `cargo`/`rustc` on PATH is not a rustup
# proxy at all (e.g. a plain Homebrew-installed `rust` formula, as this
# dev machine has: `/opt/homebrew/bin/cargo` is a direct symlink into
# `/opt/homebrew/Cellar/rust`, bypassing rustup entirely) — on such a
# machine this file is inert, and the installed Homebrew version is what
# actually runs, pinned or not. It is also NOT consulted through
# `cargo <cmd> --manifest-path <this-dir>/Cargo.toml` invoked from a
# DIFFERENT working directory (rustup's override-file search starts at the
# process's cwd, not at `--manifest-path`'s target) — run rustup-managed
# cargo from *inside* `lib/prism-quant/` (or a subdirectory) for this file
# to take effect locally.
#
# The authoritative pin for CI is therefore the explicit toolchain input on
# the `dtolnay/rust-toolchain` step in the workflow that runs the gate — this
# repository's `.github/workflows/ci.yml`, and lab-side
# `.github/workflows/prism-gates.yml` (that action resolves and
# activates the exact requested version directly, independent of the
# cwd/manifest-path subtlety above). This file is kept alongside it as the
# locally-discoverable declaration of the same pin, for any rustup-managed
# contributor machine working from within this crate directory.
[toolchain]
channel = "1.96.1"
components = ["clippy", "rustfmt"]
