[package]
name = "pngprism"
version = "0.6.0"
edition = "2024"
# Edition 2024 requires >= 1.85; pinned higher at 1.87 (clippy's
# `incompatible_msrv` caught `u32::is_multiple_of` / `usize::is_multiple_of`
# use, stable since 1.87 — verified via the `-D warnings` gate, T-0135).
rust-version = "1.87"
# Dual permissive, the Rust-ecosystem standard. Downstream-clean:
# the T-0208 audit found every dependency MIT OR Apache-2.0 (dev-only Unicode-3.0,
# which is dev-only and therefore not distributed),
# the static-vendored zlib 1.3.1 is Zlib-licensed, zopflipng is Apache-2.0 AND
# a subprocess rather than a link, and the only GPL-adjacent artifact in the
# program (pngquant/libimagequant) is a black-box measurement baseline that is
# never linked or distributed. THIRD-PARTY-NOTICES.md carries the union of
# third-party texts and must ship with any binary distribution.
license = "MIT OR Apache-2.0"
description = "Deterministic PNG palette quantizer, ditherer and lossless indexed-PNG packer. Bit-reproducible output; verified lossless."
repository = "https://github.com/jamesslock/pngprism"
homepage = "https://github.com/jamesslock/pngprism"
readme = "README.md"
keywords = ["png", "quantization", "compression", "image", "palette"]
categories = ["compression", "multimedia::images", "command-line-utilities"]
# `cargo package` ships 337 files / 647 KiB compressed. The heavy directories
# (fuzz corpus, benches) are excluded by Cargo's own rules or below; the test
# corpora ARE included deliberately, so `cargo test` works from a published
# tarball rather than only from a git checkout.
exclude = [
    "fuzz/",
    ".github/",
    # Lab-side files that exist only in the internal research checkout. The
    # assembled public repository does not contain them at all — but Cargo.toml
    # travels with the crate, so excluding them here means `cargo publish` is
    # safe from EITHER tree rather than relying on which directory someone
    # happened to run it in.
    "parity/",
    "reviews/",
    "DESIGN-DIRECTIONS.md",
    "LICENSE-RECOMMENDATION.md",
    "PORT-PLAN.md",
    # The README's comparison grid. ~1.6 MB of PNGs against a 647 KiB package:
    # it is read on GitHub and crates.io, where the README references it by
    # absolute URL pinned to the release tag, so shipping it in the tarball
    # would triple every `cargo add` download for images nobody opens locally.
    "docs/gallery/",
]

[features]
zlib-ffi-harness = []

[lints.clippy]
# The port's integer-width discipline is proven BY HAND at every site:
# every narrowing or sign-changing cast carries a range-proof comment naming the oracle invariant
# (a bin count, an alpha channel, a palette index, ...) that makes it safe
# for in-domain inputs, in the same spirit as the crate's ch17 §31
# no-panic-on-the-data-path discipline. These three `pedantic` lints fire
# on ~330 such sites crate-wide; allow them here, once, with this one
# justification, rather than an `#[allow]` at every call site.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# NOTE: `clippy::pedantic` itself is deliberately NOT enabled here. Cargo's
# `-D warnings` (the documented gate: `README.md`; lab-side, `lab/test-all.sh`)
# promotes every enabled-but-not-explicitly-allowed lint to a hard error —
# including ones a `[lints]` table sets to merely "warn" — so turning on
# `pedantic` crate-wide today would fail the build on the ~160 remaining
# pedantic findings outside this docs/lint/ops pass's scope (missing
# `# Errors`/`# Panics` docs, doc markdown, etc., mostly in `png.rs`/
# `dither.rs`/`main.rs`). The three cast lints above are pre-allowed now,
# with this one justification, so that follow-up work (tri-review action
# 10) can enable `pedantic = "deny"` once those findings are paid down
# without re-litigating the cast question.

[dependencies]
# zlib (C library) backend ONLY: PNG emission must be byte-identical to
# Python's zlib.compress(data, 9). The direct libz-sys dependency below
# unifies this backend onto the pinned static-vendored zlib 1.3.1 build.
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib"] }
# Direct FFI to the SAME C zlib flate2 links. `static` forces libz-sys to
# compile its bundled stock zlib 1.3.1 and bypass host discovery; the other
# features are explicit so this determinism contract cannot drift with
# libz-sys defaults. Needed for deflateCopy + Z_SYNC_FLUSH pack probes.
libz-sys = { version = "=1.1.20", default-features = false, features = ["libc", "static", "stock-zlib"] }

[dev-dependencies]
# Dev-dependency only (never ships): stage-boundary micro-benchmarks for
# T-0111's speed-tracking harness (quantize / dither / pack). Admitted
# under ch17 §30's dev-dep clause — a never-shipping benchmark harness
# needs only an exact pin + committed lockfile + ledger row (no
# null-hypothesis/spike gate; see this crate's REFERENCES.md).
criterion = "=0.8.2"

# One name everywhere: package, library, binary and CLI strings are all
# `pngprism`, so `cargo add pngprism` is followed by `use pngprism::…`. The
# library was called `prism_quant` while the crate was internal, mirroring the
# Python reference module it was ported from; that mirror cost every future user
# a moment of confusion, so it was renamed before the first publish — after
# publication it would have been a breaking change for every dependent.
[lib]
name = "pngprism"
path = "src/lib.rs"

[[bin]]
name = "pngprism"
path = "src/main.rs"

[[bench]]
name = "stage_boundaries"
harness = false

[[example]]
name = "zlib_ffi_probe"
required-features = ["zlib-ffi-harness"]
